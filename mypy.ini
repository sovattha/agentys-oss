[mypy]
python_version = 3.11
# Do not follow imports outside the allowlist — keeps the blast radius scoped.
# Strict mode is enabled only on the per-file sections below; the global
# defaults here stay permissive so mypy doesn't spider into untyped deps.
follow_imports = silent
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True

# ─────────────────────────────────────────────────────────────────────────────
# Full strict — bug #290 ground-zero file. Any silent-failure regression
# here (import, attribute, return type) must break the CI build.
# ─────────────────────────────────────────────────────────────────────────────
[mypy-app.api.websocket]
strict = True

# ─────────────────────────────────────────────────────────────────────────────
# Targeted strict — surrounding blast radius of #290.
# Full strict would surface 190+ cosmetic errors (type-arg, no-untyped-def,
# no-untyped-call) that are noise for our goal. We keep the error codes that
# actually catch the #290 class of bugs:
#   - attr-defined : missing method (e.g. AccountRepository.get_by_id)
#   - assignment   : wrong type assigned to typed target
#   - arg-type     : wrong type passed to typed parameter
#   - index        : indexing the wrong type (None.get, dict key mismatch)
#   - no-any-return: leaking Any through an annotated signature
#   - call-arg     : wrong argument count / keyword mismatch
#   - var-annotated: missing annotation on ambiguous assignment
# When a file crosses the "clean" threshold, promote it to full strict.
# ─────────────────────────────────────────────────────────────────────────────
[mypy-app.api.onboarding]
strict = True
disable_error_code = type-arg, no-untyped-def, no-untyped-call

[mypy-app.onboarding.manager]
strict = True
disable_error_code = type-arg, no-untyped-def, no-untyped-call

[mypy-app.faq_agent]
strict = True
disable_error_code = type-arg, no-untyped-def, no-untyped-call

[mypy-app.api.routes_helpers]
# Large legacy file (2500+ LOC). Keep strict on the error codes that catch
# the #290 class of bugs (attr-defined) but silence the long tail of noise
# until a dedicated typing pass. The attr-defined check has already
# surfaced two real latent bugs here (body_preview, get_messages(folder=))
# which are tracked separately — see TODO comments in the file.
strict = True
disable_error_code = type-arg, no-untyped-def, no-untyped-call, no-any-return, assignment, arg-type, var-annotated, index, call-arg

# ─────────────────────────────────────────────────────────────────────────────
# Third-party stubs we explicitly silence (no useful types shipped).
# ─────────────────────────────────────────────────────────────────────────────
[mypy-flask_socketio.*]
ignore_missing_imports = True

[mypy-socketio.*]
ignore_missing_imports = True

[mypy-eventlet.*]
ignore_missing_imports = True
